<!DOCTYPE html>

<html class="dark" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(18, 18, 29, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(240, 67, 155, 0.2);
        }

        .neon-glow-primary:hover {
            box-shadow: 0 0 20px rgba(240, 67, 155, 0.4);
        }

        .input-glow:focus {
            box-shadow: 0 4px 15px -5px rgba(34, 211, 238, 0.4);
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .bg-mesh {
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(240, 67, 155, 0.1) 1px, transparent 0);
            background-size: 32px 32px;
        }

        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(34, 211, 238, 0.2), transparent);
            position: absolute;
            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            from { top: -5%; }
            to { top: 105%; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#F0439B",
                      "secondary": "#22D3EE",
                      "tertiary": "#A3E635",
                      "background": "#12121d",
                      "on-background": "#e3e0f1",
                      "surface-container": "#1f1e2a",
                      "surface-container-low": "#1b1a26",
                      "surface-container-lowest": "#0d0d18",
                      "on-surface": "#e3e0f1",
                      "on-surface-variant": "#dfbec8",
                      "outline": "#a68993",
                      "outline-variant": "#584049",
                      "primary-container": "#570032",
                      "on-primary-container": "#ffd9e5",
                      "on-secondary-fixed": "#001f25"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "sm": "16px",
                      "lg": "40px",
                      "base": "8px",
                      "xs": "8px",
                      "container-max": "1280px",
                      "gutter": "24px",
                      "md": "24px",
                      "xl": "64px"
              },
              "fontFamily": {
                      "display-lg-mobile": ["Sora"],
                      "display-lg": ["Sora"],
                      "headline-md": ["Sora"],
                      "label-caps": ["JetBrains Mono"],
                      "body-base": ["Sora"],
                      "data-mono": ["JetBrains Mono"]
              },
              "fontSize": {
                      "display-lg-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "800"}],
                      "display-lg": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                      "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                      "label-caps": ["12px", {"lineHeight": "1", "fontWeight": "700"}],
                      "body-base": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                      "data-mono": ["14px", {"lineHeight": "1.5", "letterSpacing": "0.05em", "fontWeight": "500"}]
              }
            },
          },
        }
      </script>
</head>
<body class="bg-background text-on-background font-body-base min-h-screen overflow-hidden flex flex-col items-center justify-center relative">
<!-- Background Elements -->
<div class="absolute inset-0 z-0 bg-mesh opacity-30"></div>
<div class="absolute inset-0 z-0 bg-[radial-gradient(circle_at_50%_50%,_rgba(240,67,155,0.1)_0%,_transparent_70%)]"></div>
<div class="scanline z-0 opacity-20"></div>
<!-- Main Content Container -->
<main class="w-full max-w-md px-gutter z-10 flex flex-col items-center gap-xl">
<!-- Header / Logo Section -->
<header class="flex flex-col items-center text-center">
<h1 class="font-display-lg-mobile text-display-lg-mobile bg-clip-text text-transparent bg-gradient-to-r from-[#F0439B] to-[#22D3EE] tracking-tighter drop-shadow-[0_0_15px_rgba(240,67,155,0.5)]">
                SILUNET
            </h1>
<p class="font-data-mono text-data-mono text-secondary mt-xs tracking-widest uppercase">
                Adivina la silueta tecnológica
            </p>
</header>
<!-- Glassmorphism Join Card -->
<div class="glass-card w-full rounded-xl p-md flex flex-col gap-md shadow-2xl relative group">
<!-- Decorative corner elements -->
<div class="absolute -top-1 -left-1 w-4 h-4 border-t-2 border-l-2 border-primary/50"></div>
<div class="absolute -bottom-1 -right-1 w-4 h-4 border-b-2 border-r-2 border-secondary/50"></div>
<div class="space-y-xs"><p class="text-on-surface font-headline-md text-lg mb-xs">¡Hola, Piloto! Prepárate para el reto.</p>
<div class="flex items-center justify-between">
<label class="font-label-caps text-label-caps text-secondary/80" for="nickname">IDENTIDAD_PILOTO</label>
<span class="flex h-2 w-2 rounded-full bg-primary animate-pulse"></span>
</div>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-b border-outline-variant focus:border-secondary text-on-surface p-sm font-body-base outline-none transition-all input-glow placeholder:text-outline-variant/50 rounded-t-lg" id="nickname" placeholder="Introduce tu apodo..." type="text"/>
<div class="absolute right-3 top-1/2 -translate-y-1/2">
<span class="material-symbols-outlined text-outline-variant text-base">terminal</span>
</div>
</div>
</div>
<!-- Technical Status Simulation -->
<div class="flex justify-between items-center py-xs px-sm bg-primary-container/20 rounded-lg border border-outline-variant/10">
<div class="flex flex-col">
<span class="text-[10px] font-label-caps text-outline-variant">STATUS</span>
<span class="font-data-mono text-[12px] text-tertiary">READY_TO_LINK</span>
</div>
<div class="flex gap-xs">
<div class="w-1 h-3 bg-tertiary/20"></div>
<div class="w-1 h-3 bg-tertiary/40"></div>
<div class="w-1 h-3 bg-tertiary/60"></div>
<div class="w-1 h-3 bg-tertiary shadow-[0_0_8px_#A3E635]"></div>
</div>
</div>
<!-- CTA Button -->
<button class="group relative w-full py-md px-lg bg-[#F0439B] rounded-xl font-headline-md text-headline-md text-white overflow-hidden transition-all active:scale-[0.98] hover:brightness-110 shadow-[0_0_25px_rgba(240,67,155,0.5)]">
<div class="absolute inset-0 bg-gradient-to-r from-[#F0439B] to-[#ff6fb1] opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
<span class="relative z-10 flex items-center justify-center gap-xs">
                    Entrar al Juego
                    <span class="material-symbols-outlined font-bold">bolt</span>
</span>
<!-- Glowing aura -->
<div class="absolute -inset-1 bg-primary/20 blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</div>
<!-- Footer Visual Hint -->
<div class="flex flex-col items-center gap-xs opacity-50">
<div class="flex gap-base">
<div class="w-8 h-1 bg-primary rounded-full"></div>
<div class="w-2 h-1 bg-secondary rounded-full"></div>
<div class="w-2 h-1 bg-tertiary rounded-full"></div>
</div>
<span class="font-label-caps text-[10px] text-outline">NODES_CONNECTED: 2.4K</span>
</div>
</main>
<!-- Interactive script for button and input -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('nickname');
            const button = document.querySelector('button');

            // Simple focus interaction
            input.addEventListener('focus', () => {
                document.querySelector('.glass-card').style.borderColor = 'rgba(34, 211, 238, 0.4)';
            });

            input.addEventListener('blur', () => {
                document.querySelector('.glass-card').style.borderColor = 'rgba(240, 67, 155, 0.2)';
            });

            // Button click interaction
            button.addEventListener('click', () => {
                if(input.value.trim() === "") {
                    input.classList.add('border-error');
                    setTimeout(() => input.classList.remove('border-error'), 1000);
                    return;
                }
                
                // Transition effect simulation
                const originalContent = button.innerHTML;
                button.innerHTML = '<span class="material-symbols-outlined animate-spin">autorenew</span>';
                setTimeout(() => {
                    button.innerHTML = '<span class="font-data-mono">LINK_ESTABLISHED</span>';
                }, 800);
            });
        });
    </script>
</body></html>
