<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">check_circle</span>

</div>
<script>
    // Micro-interactions and Logic
    const timerBar = document.getElementById('timer-bar');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const countdownText = document.getElementById('countdown-text');
    const successToast = document.getElementById('success-toast');

    // Simulate Timer Progress
    let width = 75;
    const interval = setInterval(() => {
        width -= 2;
        if (width < 0) width = 0;
        timerBar.style.width = width + '%';
        
        // Color Shift
        if (width < 30) {
            timerBar.classList.remove('bg-candy-cyan');
            timerBar.classList.add('bg-error');
        } else {
            timerBar.classList.add('bg-candy-cyan');
            timerBar.classList.remove('bg-error');
        }
        if (width === 0) clearInterval(interval);
    }, 1000);

    // Function to trigger Countdown
    function triggerCountdown() {
        countdownOverlay.classList.remove('hidden');
        let count = 3;
        const countInterval = setInterval(() => {
            count--;
            if (count > 0) {
                countdownText.innerText = count;
            } else if (count === 0) {
                countdownText.innerText = "¡YA!";
                countdownText.classList.add('scale-150', 'text-candy-lime');
            } else {
                countdownOverlay.classList.add('opacity-0');
                setTimeout(() => countdownOverlay.classList.add('hidden'), 500);
                clearInterval(countInterval);
            }
        }, 1000);
    }

    // Function to trigger Success
    function showSuccess() {
        successToast.classList.remove('opacity-0');
        successToast.classList.add('opacity-100', 'translate-y-0');
        setTimeout(() => {
            successToast.classList.add('opacity-0', 'translate-y-[-20px]');
        }, 3000);
    }

    // For demonstration purposes, trigger success on "Enviar" click
    document.querySelector('button.bg-candy-fuchsia').addEventListener('click', (e) => {
        e.preventDefault();
        showSuccess();
    });

    // Trigger countdown on page load
    window.addEventListener('load', () => {
        setTimeout(triggerCountdown, 500);
    });
</script>
