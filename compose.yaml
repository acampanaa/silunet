services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: silunet
      POSTGRES_USER: silunet
      POSTGRES_PASSWORD: silunet_dev
    ports:
      # Solo desarrollo en una laptop; no expone la contraseña de ejemplo a la LAN.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silunet -d silunet"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - silunet_postgres_data:/var/lib/postgresql/data

volumes:
  silunet_postgres_data:
