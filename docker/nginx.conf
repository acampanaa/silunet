map $http_upgrade $silunet_connection_upgrade {
  default upgrade;
  '' close;
}

map $http_x_forwarded_proto $silunet_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

upstream silunet_nodes {
  least_conn;
  server node1:3001 max_fails=1 fail_timeout=3s;
  server node2:3001 max_fails=1 fail_timeout=3s;
  server node3:3001 max_fails=1 fail_timeout=3s;
}

server {
  listen 8080;
  server_name _;

  location / {
    proxy_pass http://silunet_nodes;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $silunet_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $silunet_connection_upgrade;
    proxy_connect_timeout 2s;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
  }
}
