sonar.projectKey=silunet
sonar.projectName=Silunet
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=src,public
sonar.tests=test
sonar.test.inclusions=test/**/*.ts,test/**/*.js,test/**/*.java
sonar.exclusions=node_modules/**,dist/**,coverage/**,reports/**,target/**,tmp/**,inspo/**,public/vendor/**

# La cobertura se mide sobre las unidades seleccionadas para esta actividad.
# El resto del código sigue siendo analizado por SonarQube para calidad.
sonar.coverage.inclusions=src/lamport.ts,src/mutex.ts,src/wordBank.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.junit.reportPaths=target/surefire-reports
sonar.java.test.binaries=target/test-classes